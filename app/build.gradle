plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'id.bram.lanjutplaylist'
    compileSdk 34

    defaultConfig {
        applicationId "id.bram.lanjutplaylist"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "1.3"
    }

    signingConfigs {
        tetap {
            storeFile rootProject.file('keystore/lanjutplaylist.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: ''
            keyAlias 'lanjutplaylist'
            keyPassword System.getenv('KEYSTORE_PASSWORD') ?: ''
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.tetap
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.tetap
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
