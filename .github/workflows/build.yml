name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Cek password kunci
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secret KEYSTORE_PASSWORD belum diisi (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - name: Build debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LanjutPlaylist-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Zip APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LanjutPlaylist.apk
          zip LanjutPlaylist-apk.zip LanjutPlaylist.apk

      - name: Publish release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9-build${{ github.run_number }}
          name: Lanjut Playlist build ${{ github.run_number }}
          make_latest: true
          files: LanjutPlaylist-apk.zip
